version: '3.8'

services:
  oracle-xe:
    image: gvenzl/oracle-free:23-slim
    container_name: funcef-oracle-xe
    ports:
      - "1521:1521"
    environment:
      - ORACLE_PASSWORD=OraclePwd123
      - APP_USER=CM
      - APP_USER_PASSWORD=cm_password
      - ORACLE_DATABASE=FREE
    volumes:
      - oracle-data:/opt/oracle/oradata
    shm_size: 1g
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - funcef-network

volumes:
  oracle-data:
    driver: local
    name: funcef-oracle-data

networks:
  funcef-network:
    driver: bridge
    name: funcef-network
