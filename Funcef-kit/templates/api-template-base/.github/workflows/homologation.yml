# Pipeline de HOMOLOGAÇÃO — padrão FUNCEF (reusable workflows de funcef-devops/pipelines).
#
# Dispara no push para main. Ao gerar um microsserviço a partir deste template, ajuste APENAS o
# valor de `environment` (o GitHub Environment do seu sistema, ex.: sis-internos-hom).
#
# Diferença para development.yml: não há job de criação da API no APIM — em HML a API já existe,
# criada na primeira passagem pelo ambiente de desenvolvimento; aqui ela é apenas atualizada.
name: Homologação

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: "deploy-hom"

jobs:
  deploy-to-web-app:
    name: Deploy para ambiente de homologação
    uses: funcef-devops/pipelines/.github/workflows/dotnet-deploy-to-web-app.yml@main
    with:
      environment: sis-internos-hom
    secrets:
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      APP_SUBSCRIPTION_ID: ${{ secrets.APP_SUBSCRIPTION_ID }}
      APP_RESOURCE_GROUP: ${{ secrets.APP_RESOURCE_GROUP }}
      FUNCEF_PACKAGES_TOKEN: ${{ secrets.FUNCEF_PACKAGES_TOKEN }}
      DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}

  deploy-to-apim:
    name: Realizar deploy no API Management
    uses: funcef-devops/pipelines/.github/workflows/update-apim.yml@main
    needs: deploy-to-web-app
    with:
      environment: sis-internos-hom
    secrets:
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      APP_SUBSCRIPTION_ID: ${{ secrets.APP_SUBSCRIPTION_ID }}
      APP_RESOURCE_GROUP: ${{ secrets.APP_RESOURCE_GROUP }}
      APIM_SUBSCRIPTION_ID: ${{ secrets.APIM_SUBSCRIPTION_ID }}
      APIM_RESOURCE_GROUP_NAME: ${{ secrets.APIM_RESOURCE_GROUP_NAME }}
      APIM_NAME: ${{ secrets.APIM_NAME }}
