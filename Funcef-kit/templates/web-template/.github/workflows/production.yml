name: Produção

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  deploy-to-production:
    name: Build e deploy
    if: ${{ vars.DEPLOY_ENABLED == 'true' && github.event.pull_request.merged == true && contains(github.head_ref, 'release-please-') }}
    uses: funcef-devops/pipelines/.github/workflows/nextjs-deploy-to-web-app.yml@main
    with:
      environment: web-template-prd # TODO: Rename to <project>-prd
      versionize: 'true'
      additional-variables: |
        API_URL
        NEXT_PUBLIC_ENTRADA_URL
        NEXT_PUBLIC_APP_URL
        NEXT_PUBLIC_BASE_PATH
        MICROSOFT_CLIENT_ID
        MICROSOFT_CLIENT_SECRET
        TENANT_ID
        AUDIENCE_API
        BETTER_AUTH_SECRET
        REDIS_URL
        COOKIE_MAX_AGE
    secrets:
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      KEY_VAULT_RESOURCE_NAME: ${{ secrets.KEY_VAULT_RESOURCE_NAME }}
      APP_SUBSCRIPTION_ID: ${{ secrets.APP_SUBSCRIPTION_ID }}
      APP_RESOURCE_GROUP: ${{ secrets.APP_RESOURCE_GROUP }}
      FUNCEF_PACKAGES_TOKEN: ${{ secrets.FUNCEF_PACKAGES_TOKEN }}
      FUNCEF_DEVOPS_TOKEN: ${{ secrets.FUNCEF_DEVOPS_TOKEN }}
      RELEASE_PLEASE_GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_GITHUB_TOKEN }}
      DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
