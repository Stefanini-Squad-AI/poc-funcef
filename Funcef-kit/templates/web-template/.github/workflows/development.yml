# DEPLOY_ENABLED gating
#
# Este workflow usa a variável `DEPLOY_ENABLED` para evitar falhas no CI do
# template-repo, que não possui os secrets de infra (ARM_*, KEY_VAULT_*, etc.).
#
# Para habilitar deploys em um novo projeto:
#   1. Vá em Settings → Secrets and variables → Actions → Variables
#   2. Crie a variável DEPLOY_ENABLED com valor `true`
#   3. Configure os secrets necessários (ARM_TENANT_ID, ARM_CLIENT_ID,
#      ARM_CLIENT_SECRET, KEY_VAULT_RESOURCE_NAME, APP_SUBSCRIPTION_ID,
#      APP_RESOURCE_GROUP, FUNCEF_PACKAGES_TOKEN, FUNCEF_DEVOPS_TOKEN,
#      DOCKER_REGISTRY)
#   4. Renomeie o environment `web-template-dev` para `<projeto>-dev`
#
name: Desenvolvimento

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  deploy-to-development:
    name: Build e deploy
    if: ${{ vars.DEPLOY_ENABLED == 'true' && !contains(github.head_ref, 'release-please-') }}
    uses: funcef-devops/pipelines/.github/workflows/nextjs-deploy-to-web-app.yml@main
    with:
      environment: web-template-dev # TODO: Rename to <project>-dev
      additional-variables: |
        API_URL
        NEXT_PUBLIC_ENTRADA_URL
        NEXT_PUBLIC_APP_URL
        NEXT_PUBLIC_BASE_PATH
        MICROSOFT_CLIENT_ID
        MICROSOFT_CLIENT_SECRET
        TENANT_ID
        AUDIENCE_API
        BETTER_AUTH_SECRET
        REDIS_URL
        COOKIE_MAX_AGE
    secrets:
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      KEY_VAULT_RESOURCE_NAME: ${{ secrets.KEY_VAULT_RESOURCE_NAME }}
      APP_SUBSCRIPTION_ID: ${{ secrets.APP_SUBSCRIPTION_ID }}
      APP_RESOURCE_GROUP: ${{ secrets.APP_RESOURCE_GROUP }}
      FUNCEF_PACKAGES_TOKEN: ${{ secrets.FUNCEF_PACKAGES_TOKEN }}
      FUNCEF_DEVOPS_TOKEN: ${{ secrets.FUNCEF_DEVOPS_TOKEN }}
      DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
