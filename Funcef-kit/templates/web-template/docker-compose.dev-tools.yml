name: web-template

services:
  redis:
    image: redis:alpine
    container_name: web-template-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - dev-tools
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3

  redisinsight:
    image: redis/redisinsight:latest
    container_name: web-template-redisinsight
    ports:
      - '5540:5540'
    volumes:
      - redisinsight_data:/data
    networks:
      - dev-tools
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
  redisinsight_data:

networks:
  dev-tools:
    driver: bridge
